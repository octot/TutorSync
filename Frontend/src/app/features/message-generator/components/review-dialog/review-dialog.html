<h2 mat-dialog-title class="dialog-title">
    Review Generated Messages
</h2>

<div mat-dialog-content class="dialog-content">

    @for (message of data.messages; track $index) {

    <mat-card class="message-card">

        <mat-card-header>

            <mat-card-title>

                @if (message.recipientType === 'TUTOR') {

                👨‍🏫 Tutor Message

                } @else {

                👨‍👩‍👦 Parent Message

                }

            </mat-card-title>

        </mat-card-header>

        <mat-card-content>
            <pre class="message-preview">{{ message.message }}</pre>
        </mat-card-content>

        <!-- Copy feature -->
        <mat-card-actions align="end" class="message-actions">

            <button mat-button color="primary" (click)="copyMessage(message.message)">

                <mat-icon>content_copy</mat-icon>

                Copy

            </button>

        </mat-card-actions>
    </mat-card>

    }

</div>

<div mat-dialog-actions class="dialog-actions">

    <button mat-button mat-dialog-close>

        Cancel

    </button>

    <button mat-raised-button color="primary" (click)="sendToAdmin()" [disabled]="isSending">

        <mat-icon>send</mat-icon>

        @if (isSending) {

        Sending...

        } @else {

        Send to Admin

        }

    </button>
</div>
